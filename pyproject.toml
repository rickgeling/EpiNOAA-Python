[tool.poetry]
name = "nclimgrid-plotting"
version = "0.1.0"
description = "Scripts to support Deke Arndt's Plotting of NClimGrid Data"
authors = ["Denis <dwillett@cicsnc.org>"]

[tool.poetry.dependencies]
python = "^3.9"
polars = "^0.20.0"
s3fs = "^2022.3.0"  # may need bumping if issues come up
commitizen = "^2.23.0"  # dev tool, version not critical
pyarrow = "^16.0.0"
pendulum = "^3.0.0"  # needed for Python 3.12 compat
pandas = "^2.2.0"
mkdocs = "^1.3.0"  # dev tool, version not critical
seaborn = "^0.13.2"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"